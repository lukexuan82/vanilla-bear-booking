<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>香草貝兒｜房況查詢</title>


<style>

/* ==================================================
   基本設定
================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{

  margin:0;

  background:#f8f5f0;

  color:#4b3b32;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

}


/* ==================================================
   香草貝兒標題
================================================== */

.top{

  width:100%;

  text-align:center;

  padding:22px 10px 12px;

}


.brand{

  font-size:28px;

  font-weight:700;

  letter-spacing:4px;

  color:#6f5546;

  margin-bottom:6px;

}


.subtitle{

  font-size:14px;

  letter-spacing:1px;

  color:#987d6d;

}


/* ==================================================
   主要卡片
================================================== */

.card{

  width:min(
    650px,
    calc(100% - 24px)
  );

  max-width:650px;

  margin:12px auto;

  background:#fffdf9;

  border:1px solid #eee3d8;

  border-radius:26px;

  padding:20px;

  box-shadow:
    0 10px 30px rgba(92,70,50,.08);

}


/* ==================================================
   標題
================================================== */

h2{

  font-size:20px;

  margin:0 0 16px;

  color:#40352f;

}


/* ==================================================
   日期區
================================================== */

.row{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  gap:12px;

  width:100%;

}


.date-box{

  width:100%;

  min-width:0;

  max-width:100%;

}


.date-box > label{

  display:block;

  font-size:13px;

  color:#9a7765;

  margin:0 0 7px;

}


/* ==================================================
   ★ 日期框
   整個框都可以點
================================================== */

.date-input-wrap{

  position:relative;

  width:92%;

  max-width:92%;

  height:54px;

  margin:0 auto;

  border:1px solid #eadfd5;

  border-radius:16px;

  background:#ffffff;

  overflow:hidden;

  cursor:pointer;

  user-select:none;

  -webkit-user-select:none;

}


/* ==================================================
   ★ 日期顯示文字
================================================== */

.date-display{

  position:absolute;

  top:50%;

  left:50%;

  width:100%;

  height:auto;

  transform:
    translate(-50%, -50%);

  display:block;

  padding:0 45px 0 12px;

  font-size:20px;

  font-weight:500;

  line-height:1.2;

  color:#40352f;

  text-align:center;

  white-space:nowrap;

  pointer-events:none;

  z-index:1;

}


/* ==================================================
   日期圖示
================================================== */

.date-icon{

  position:absolute;

  right:13px;

  top:50%;

  transform:
    translateY(-50%);

  font-size:18px;

  line-height:1;

  pointer-events:none;

  z-index:1;

}


/* ==================================================
   ★ 真正日期 input
   隱藏，只讓外層框負責點擊
================================================== */

.date-input-wrap input[type="date"]{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  margin:0;

  padding:0;

  border:0;

  outline:none;

  background:transparent;

  opacity:0;

  cursor:pointer;

  pointer-events:none;

  z-index:0;

}


/* ==================================================
   人數
================================================== */

.people{

  margin-top:16px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  width:100%;

}


.person-box{

  min-width:0;

  width:100%;

  border:
    1px solid #eadfd5;

  border-radius:16px;

  padding:12px;

  background:#fffaf5;

}


.person-box > label{

  display:block;

  margin-bottom:7px;

  font-size:14px;

  color:#9a7765;

}


select{

  width:100%;

  max-width:100%;

  min-width:0;

  height:48px;

  border:
    1px solid #eadfd5;

  border-radius:14px;

  background:#ffffff;

  padding:0 10px;

  font-size:16px;

  color:#40352f;

}


/* ==================================================
   小孩年齡
================================================== */

.child-ages{

  margin-top:12px;

  display:grid;

  grid-template-columns:1fr;

  gap:10px;

  width:100%;

}


.age-item{

  width:100%;

  font-size:13px;

  color:#806b5d;

}


.age-item label{

  display:block;

  font-size:12px;

  margin-bottom:5px;

}


.age-item select{

  width:100%;

  height:46px;

  font-size:16px;

}


/* ==================================================
   查詢按鈕
================================================== */

.search-button{

  width:100%;

  height:50px;

  border:0;

  border-radius:14px;

  background:#7d6454;

  color:#ffffff;

  font-size:17px;

  font-weight:600;

  margin-top:16px;

  cursor:pointer;

}


.search-button:hover{

  opacity:.9;

}


/* ==================================================
   查詢結果
================================================== */

.result{

  margin-top:14px;

  padding:16px;

  border-radius:18px;

  background:#edf7f0;

}


.result.bad{

  background:#fbe9e6;

}


.result h3{

  margin:0 0 8px;

  font-size:18px;

}


.result p{

  margin:5px 0;

  line-height:1.6;

}


.dot{

  display:inline-block;

  width:18px;

  height:18px;

  border-radius:50%;

  vertical-align:-3px;

  margin-right:7px;

  background:#49d58d;

}


.bad .dot{

  background:#e96b63;

}


/* ==================================================
   LINE 按鈕
================================================== */

.line-button{

  display:block;

  width:100%;

  min-height:52px;

  line-height:52px;

  text-align:center;

  border-radius:15px;

  background:#06c755;

  color:#ffffff;

  text-decoration:none;

  font-size:17px;

  font-weight:700;

  margin-top:14px;

  box-shadow:
    0 5px 12px rgba(6,199,85,.18);

  cursor:pointer;

  border:0;

  transition:.2s ease;

}


.line-button.disabled{

  background:#b8b0aa;

  color:#ffffff;

  box-shadow:none;

  cursor:not-allowed;

}


.line-button.loading{

  background:#8e8178;

  cursor:wait;

}


/* ==================================================
   日曆
================================================== */

.calendar-card{

  padding:18px;

  margin-top:14px;

}


.cal-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:10px;

}


.nav{

  width:42px;

  height:42px;

  margin:0;

  border:0;

  border-radius:12px;

  background:#f2ece5;

  color:#765e4e;

  font-size:22px;

  padding:0;

  cursor:pointer;

}


.month{

  font-size:20px;

  font-weight:600;

}


.week{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:5px;

  text-align:center;

  color:#a47e6c;

  font-size:12px;

  margin-bottom:6px;

}


.days{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:5px;

}


.day{

  min-height:66px;

  border-radius:13px;

  padding:8px 3px;

  text-align:center;

  font-size:14px;

}


.available{

  background:#edf7f0;

}


.full{

  background:#fbe8e5;

  color:#a94a40;

}


.holiday{

  box-shadow:
    inset 0 -3px 0 #c89a36;

}


.day small{

  display:block;

  font-size:10px;

  margin-top:6px;

}


.empty{

  background:transparent;

}


/* ==================================================
   手機版
================================================== */

@media(max-width:560px){

  .card{

    width:calc(100% - 24px);

    max-width:none;

    padding:16px;

    border-radius:22px;

  }


  .row{

    grid-template-columns:1fr;

    gap:12px;

    width:100%;

  }


  .date-input-wrap{

    width:92%;

    max-width:92%;

    height:54px;

    margin:0 auto;

  }


  .date-display{

    top:50%;

    left:50%;

    width:100%;

    padding:0 45px 0 12px;

    font-size:20px;

    font-weight:500;

    line-height:1.2;

    text-align:center;

    transform:
      translate(-50%, -50%);

  }


  .date-icon{

    right:13px;

    top:50%;

    transform:
      translateY(-50%);

    font-size:18px;

  }


  .people{

    grid-template-columns:
      repeat(3,1fr);

    gap:8px;

    width:100%;

  }


  .person-box{

    width:100%;

    min-width:0;

    padding:10px 8px;

  }


  .person-box > label{

    font-size:13px;

  }


  .person-box select{

    width:100%;

    min-width:0;

    max-width:100%;

    padding:0 7px;

    font-size:15px;

  }


  .brand{

    font-size:26px;

  }


  .subtitle{

    font-size:13px;

  }


  .day{

    min-height:60px;

  }


  .line-button{

    font-size:16px;

  }


  .age-item select{

    height:46px;

    font-size:16px;

  }

}


/* ==================================================
   更小手機
================================================== */

@media(max-width:380px){

  .people{

    gap:6px;

  }


  .person-box{

    padding:9px 6px;

  }


  .person-box > label{

    font-size:12px;

  }


  .person-box select{

    font-size:14px;

  }


  .date-input-wrap{

    width:92%;

    max-width:92%;

  }


  .date-display{

    font-size:18px;

    line-height:1.2;

  }

}

</style>

</head>


<body>


<!-- ==================================================
     香草貝兒標題
================================================== -->

<div class="top">

  <div class="brand">
    🌿 香草貝兒
  </div>

  <div class="subtitle">
    寵物友善包棟民宿・房況查詢
  </div>

</div>


<!-- ==================================================
     查詢卡片
================================================== -->

<section class="card">

  <h2>
    🗓️ 查詢住宿日期
  </h2>


  <div class="row">


    <!-- ==================================================
         入住日期
    ================================================== -->

    <div class="date-box">

      </label>


      <!-- ★ 整個日期框都可以點 -->

      <div

        tabindex="0"

        </span>


        <input

          tabindex="-1"

        >

      </div>

    <!-- ==================================================
         退房日期
    ================================================== -->

    <div class="date-box">

        退房日期
      </label>


      <!-- ★ 整個日期框都可以點 -->

      <div
        class="date-input-wrap"
        onclick="openDatePicker('checkout')"
        onkeydown="handleDateKey(event,'checkout')"
        role="button"
        tabindex="0"
        aria-label="選擇退房日期"
      >

        <div
          id="checkoutDisplay"
          class="date-display"
        ></div>


        <span class="date-icon">

        <input

          onchange="updateDateDisplay('checkout')"
          aria-hidden="true"

  <!-- ==================================================

  ================================================== -->

  <div class="people">


    <!-- 大人 -->

    <div class="person-box">

      <label>
        👨‍👩‍👧 大人
      </label>


      <select id="adults">

        <option value="1">

        <option value="2" selected>

        </option>

        <option value="3">

        </option>

        <option value="6">
          6 位
        </option>

          7 位

        </option>

        <option value="1">
          1 位

        <option value="2">
          2 位
        </option>

        <option value="3">

        </option>

        <option value="4">
          4 位
        </option>

        <option value="5">
          5 位
        </option>

        <option value="6">
          6 位
        </option>

        <option value="7">
          7 位
        </option>

        <option value="8">

      </select>


      <div
        id="childAges"

    <!-- 毛孩 -->

  <!-- ==================================================

       LINE

<!-- ==================================================
     日曆
================================================== -->

<section class="card calendar-card">


  <div class="cal-head">


    <button
      class="nav"
      onclick="changeMonth(-1)"
    >
      ‹
    </button>


    <div
      id="monthTitle"
      class="month"
    ></div>

      class="nav"
      onclick="changeMonth(1)"
    >
      ›
    </button>


  </div>


  <div class="week">

    <div>日</div>

  </div>

    id="days"
    class="days"

<script>


/* ==================================================
   Google Apps Script API
================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyk2rGhw0sSKTl6BrKBN1-shZzJ0yWYsZjmDazgRHvWM1gFEyuYZ_vqFRTDh06FOkYV7g/exec";


/* ==================================================
   LINE 官方帳號
================================================== */

const LINE_ID =
"@812xoprs";


/* ==================================================
   全域變數
================================================== */

let calendarData = [];

let viewDate = new Date();


/* ==================================================
   日期工具
================================================== */

function pad(n){

  return String(n).padStart(2,"0");

}


function key(y,m,d){

  return `${y}-${pad(m+1)}-${pad(d)}`;

}


function formatDate(s){

  return s.replaceAll("-","/");

}


/* ==================================================
   日期顯示
================================================== */

function formatDisplayDate(value){

  if(!value){

    return "請選擇日期";

  }


  const parts =
    value.split("-");


  if(parts.length !== 3){

    return "請選擇日期";

  }


  return (

    `${parts[0]}年` +

    `${Number(parts[1])}月` +

    `${Number(parts[2])}日`

  );

}


/* ==================================================
   ★★★ 開啟日期選擇器 ★★★
   
   這裡是這次真正修正的核心。
   
   不再讓 input 自己接收滑鼠，
   而是由外面的整個日期框呼叫 showPicker。
================================================== */

function openDatePicker(id){

  const input =
    document.getElementById(id);


  if(!input){

    return;

  }


  /* Chrome / Edge / 支援 showPicker 的瀏覽器 */

  if(
    typeof input.showPicker === "function"
  ){

    try{

      input.showPicker();

      return;

    }

    catch(error){

      console.log(
        "showPicker 開啟失敗，使用備援方式",
        error
      );

    }

  }


  /* 不支援 showPicker 的瀏覽器 */

  try{

    input.focus();

    input.click();

  }

  catch(error){

    console.log(
      "日期選擇器無法開啟",
      error
    );

  }

}


/* ==================================================
   ★ 鍵盤也可以開日期
================================================== */

function handleDateKey(event,id){

  if(
    event.key === "Enter" ||
    event.key === " "
  ){

    event.preventDefault();

    openDatePicker(id);

  }

}


/* ==================================================
   日期變更
================================================== */

function updateDateDisplay(id){

  const input =
    document.getElementById(id);


  const display =
    document.getElementById(
      id + "Display"
    );


  if(
    !input ||
    !display
  ){

    return;

  }


  display.textContent =
    formatDisplayDate(
      input.value
    );


  if(input.value){

    syncCalendarToDate(
      input.value
    );

  }


  updateLineButtonState();

}


/* ==================================================
   日期同步月曆
================================================== */

function syncCalendarToDate(dateString){

  if(!dateString){

    return;

  }


  const parts =
    dateString.split("-");


  if(parts.length !== 3){

    return;

  }


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]) - 1;


  viewDate =
    new Date(
      year,
      month,
      1
    );


  renderCalendar();

}


/* ==================================================
   小孩年齡
================================================== */

function renderChildAges(){

  const n =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const box =
    document.getElementById(
      "childAges"
    );


  box.innerHTML = "";


  for(
    let i = 1;
    i <= n;
    i++
  ){

    const wrap =
      document.createElement(
        "div"
      );


    wrap.className =
      "age-item";


    const label =
      document.createElement(
        "label"
      );


    label.textContent =
      `第 ${i} 位小孩年齡`;


    const select =
      document.createElement(
        "select"
      );


    select.className =
      "child-age";


    for(
      let age = 0;
      age <= 7;
      age++
    ){

      const option =
        document.createElement(
          "option"
        );


      option.value =
        age;


      option.textContent =
        `${age} 歲`;


      select.appendChild(
        option
      );

    }


    wrap.appendChild(
      label
    );


    wrap.appendChild(
      select
    );


    box.appendChild(
      wrap
    );

  }

}


/* ==================================================
   取得小孩年齡
================================================== */

function getChildAges(){

  return [

    ...document.querySelectorAll(
      ".child-age"
    )

  ].map(
    x => Number(x.value)
  );

}


/* ==================================================
   判斷住宿期間是否碰到已訂日期
================================================== */

function hasBookedDate(
  checkin,
  checkout
){

  if(
    !checkin ||
    !checkout
  ){

    return false;

  }


  const start =
    new Date(
      checkin + "T00:00:00"
    );


  const end =
    new Date(
      checkout + "T00:00:00"
    );


  for(
    let d = new Date(start);

    d < end;

    d.setDate(
      d.getDate() + 1
    )
  ){

    const k =
      key(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );


    const item =
      calendarData.find(
        x => x.date === k
      );


    if(
      item &&
      (
        item.status === "已訂" ||
        item.status === "已訂滿"
      )
    ){

      return true;

    }

  }


  return false;

}


/* ==================================================
   更新 LINE 按鈕
================================================== */

function updateLineButtonState(){

  const button =
    document.getElementById(
      "lineButton"
    );


  if(!button){

    return;

  }


  const ci =
    document.getElementById(
      "checkin"
    ).value;


  const co =
    document.getElementById(
      "checkout"
    ).value;


  button.classList.remove(
    "disabled"
  );


  if(
    !ci ||
    !co
  ){

    button.disabled = false;

    button.textContent =
      "💚 立即 LINE 詢問訂房";

    return;

  }


  if(
    co <= ci
  ){

    button.disabled = true;

    button.classList.add(
      "disabled"
    );

    button.textContent =
      "🔒 請先確認住宿日期";

    return;

  }


  if(
    hasBookedDate(
      ci,
      co
    )
  ){

    button.disabled = true;

    button.classList.add(

}


/* ==================================================
   JSONP 載入日曆
================================================== */

function loadCalendar(){

  return new Promise(

    (resolve,reject)=>{

      const callbackName =
        "calendarCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      window[callbackName] =
        function(data){

          try{

            calendarData =
              Array.isArray(data)
              ? data
              : [];


            renderCalendar();


            updateLineButtonState();


            resolve(data);

          }

          finally{

            delete window[
              callbackName
            ];


            script.remove();

          }

        };


      script.src =
        API +
        "?action=calendar" +
        "&callback=" +
        callbackName;


      script.onerror =
        function(){

          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              "API讀取失敗"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }

  );

}

/* ==================================================
   日曆
================================================== */

function renderCalendar(){

  const y =
    viewDate.getFullYear();


  const m =
    viewDate.getMonth();


  document.getElementById(
    "monthTitle"
  ).textContent =
    `${y} 年 ${m+1} 月`;


  const first =
    new Date(
      y,
      m,
      1
    ).getDay();


  const total =
    new Date(
      y,
      m + 1,
      0
    ).getDate();


  const map = {};


  calendarData.forEach(
    x => {

      map[x.date] = x;

    }
  );


  const box =
    document.getElementById(
      "days"
    );


  box.innerHTML = "";


  for(
    let i = 0;
    i < first;
    i++
  ){

    box.innerHTML +=
      '<div class="day empty"></div>';

  }


  for(
    let d = 1;
    d <= total;
    d++
  ){

    const k =
      key(
        y,
        m,
        d
      );


    const x =
      map[k] || {

        status:"可訂房",

        type:"平日"

      };


    const full =
      x.status === "已訂" ||
      x.status === "已訂滿";


    const el =
      document.createElement(
        "div"
      );


    el.className =
      "day " +
      (
        full
        ? "full"
        : "available"
      ) +
      (
        x.type === "假日"
        ? " holiday"
        : ""
      );


    el.innerHTML = `

      ${d}

      <small>

        ${
          full
          ? "已滿"
          : "可預訂"
        }

        ${
          x.type === "假日"
          ? "・假日"
          : ""
        }

      </small>

    `;


    box.appendChild(
      el
    );

  }

}

================================================== */

function changeMonth(n){

  viewDate =
    new Date(
      viewDate.getFullYear(),
      viewDate.getMonth() + n,
      1
    );


  renderCalendar();

}


/* ==================================================
   計算住宿晚數
================================================== */

function calculateNights(
  ci,
  co
){

  const d1 =
    new Date(
      ci + "T00:00:00"
    );


  const d2 =
    new Date(
      co + "T00:00:00"
    );


  let nights = 0;


  for(
    let d = new Date(d1);

    d < d2;

    d.setDate(
      d.getDate() + 1
    )
  ){

    nights++;

  }


  return nights;

}


/* ==================================================
   LINE 自動帶入
================================================== */

async function openLineBooking(event){

  if(event){

    event.preventDefault();

  }


  const button =
    document.getElementById(
      "lineButton"
    );


  const ci =
    document.getElementById(
      "checkin"
    ).value;


  const co =
    document.getElementById(
      "checkout"
    ).value;


  const adults =
    Number(
      document.getElementById(
        "adults"
      ).value
    );


  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const pets =
    Number(
      document.getElementById(
        "pets"
      ).value
    );


  const ages =
    getChildAges();


  if(
    !ci ||
    !co
  ){

    alert(
      "請先選擇入住與退房日期"
    );


    return;

  }


  if(
    co <= ci
  ){

    alert(
      "退房日期需晚於入住日期"
    );


    return;

  }


  if(
    hasBookedDate(
      ci,
      co
    )
  ){

    button.disabled = true;

    button.classList.add(
      "disabled"
    );

    button.textContent =
      "🔒 此日期無法訂房";


    alert(
      "這段住宿期間已有滿房日期，請重新選擇。"
    );


    return;

  }


  button.disabled = true;

  button.classList.add(
    "loading"
  );

  button.textContent =
    "🔍 正在確認房況...";


  try{

    const data =
      await checkBookingJSONP(
        ci,
        co
      );


    if(
      !data ||
      !data.available
    ){

      button.disabled = true;

      button.classList.remove(
        "loading"
      );

      button.classList.add(
        "disabled"
      );

      button.textContent =
        "🔒 此日期無法訂房";


      alert(
        "這段住宿期間已有滿房日期，請重新選擇。"
      );


      return;

    }


    const nights =
      calculateNights(
        ci,
        co
      );


    let childrenText =
      "🧒 小孩：0位";


    if(children > 0){

      childrenText =
        `🧒 小孩：${children}位`;


      if(ages.length > 0){

        childrenText +=
          `（${ages.join("、")}歲）`;

      }

    }


    const message =

`🏡 香草貝兒訂房詢問
📅 入住：${formatDate(ci)}
📅 退房：${formatDate(co)}
🌙 住宿：${nights}晚
👨 大人：${adults}位
${childrenText}
🐶 毛孩：${pets}隻

想詢問以上日期是否可以訂房，謝謝！`;


    const encodedLineID =
      encodeURIComponent(
        LINE_ID
      );


    const encodedMessage =
      encodeURIComponent(
        message
      );


    const lineURL =
      "https://line.me/R/oaMessage/" +
      encodedLineID +
      "/?" +
      encodedMessage;


    window.location.href =
      lineURL;

  }


  catch(error){

    console.error(
      error
    );


    button.disabled = false;

    button.classList.remove(
      "loading"
    );

    updateLineButtonState();


    alert(
      "目前無法確認房況，請稍後再試。"
    );

  }

}


/* ==================================================
   查詢房況
================================================== */

async function checkBooking(){

  const ci =
    document.getElementById(
      "checkin"
    ).value;


  const co =
    document.getElementById(
      "checkout"
    ).value;


  const adults =
    Number(
      document.getElementById(
        "adults"
      ).value
    );


  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const pets =
    Number(
      document.getElementById(
        "pets"
      ).value
    );


  const ages =
    getChildAges();


  const result =
    document.getElementById(
      "result"
    );


  if(
    !ci ||
    !co
  ){

    result.innerHTML = `

      <div class="result bad">

        <h3>
          ⚠️ 請選擇入住與退房日期
        </h3>

      </div>

    `;


    return;

  }


  if(
    co <= ci
  ){

    result.innerHTML = `

      <div class="result bad">

        <h3>
          ⚠️ 退房日期需晚於入住日期
        </h3>

      </div>

    `;


    updateLineButtonState();


    return;

  }


  syncCalendarToDate(
    ci
  );


  result.innerHTML = `

    <div class="result">

      <h3>
        🔍 正在確認房況...
      </h3>

      <p>
        請稍候。
      </p>

    </div>

  `;


  try{

    const data =
      await checkBookingJSONP(
        ci,
        co
      );


    const d1 =
      new Date(
        ci + "T00:00:00"
      );


    const d2 =
      new Date(
        co + "T00:00:00"
      );


    let nights = 0;

    let holidayNights = 0;

    let weekdayNights = 0;


    const map = {};


    calendarData.forEach(
      x => {

        map[x.date] = x;

      }
    );


    for(
      let d = new Date(d1);

      d < d2;

      d.setDate(
        d.getDate() + 1
      )
    ){

      nights++;


      const k =
        key(
          d.getFullYear(),
          d.getMonth(),
          d.getDate()
        );


      if(
        map[k] &&
        map[k].type === "假日"
      ){

        holidayNights++;

      }

      else{

        weekdayNights++;

      }

    }


    const agesText =
      children
      ? `，小孩年齡：${ages.join("、")} 歲`
      : "";


    if(
      !data.available
    ){

      result.innerHTML = `

        <div class="result bad">

          <h3>

            <span class="dot"></span>

            目前無法訂房

          </h3>


          <p>

            ${formatDate(ci)}

            ～${formatDate(co)}

            的住宿期間已有已訂日期。

          </p>


          <p>

            大人 ${adults} 位

            ・

            小孩 ${children} 位

            ${agesText}

            ・

            毛孩 ${pets} 隻

          </p>

        </div>

      `;


      updateLineButtonState();


      return;

    }


    result.innerHTML = `

      <div class="result">

        <h3>

          <span class="dot"></span>

          可以訂房

        </h3>


        <p>

          ${formatDate(ci)}

          ～${formatDate(co)}

          共

          <b>
            ${nights} 晚
          </b>

        </p>


        <p>

          大人 ${adults} 位

          ・

          小孩 ${children} 位

          ${agesText}

          ・

          毛孩 ${pets} 隻

        </p>


        <p>

          平日 ${weekdayNights} 晚

          ・

          假日 ${holidayNights} 晚

        </p>


        <p>

          本次住宿期間目前皆可預訂。

        </p>

      </div>

    `;


    updateLineButtonState();

  }


  catch(error){

    console.error(
      error
    );


    result.innerHTML = `

      <div class="result bad">

        <h3>
          ⚠️ 查詢失敗
        </h3>

        <p>
          請稍後再試。
        </p>

      </div>

    `;

  }

}
