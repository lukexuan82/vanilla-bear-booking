<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>香草貝兒｜房況查詢</title>

<style>

/* ==================================================
   基本設定
================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

body{
  background:#f8f5f0;
  color:#4b3b32;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}


/* ==================================================
   頁首
================================================== */

.top{
  width:100%;
  text-align:center;
  padding:24px 12px 12px;
}

.brand{
  font-size:28px;
  font-weight:700;
  letter-spacing:4px;
  color:#6f5546;
  margin-bottom:6px;
}

.subtitle{
  font-size:14px;
  letter-spacing:1px;
  color:#987d6d;
}


/* ==================================================
   卡片
================================================== */

.card{
  width:min(650px, calc(100% - 24px));
  max-width:650px;
  margin:12px auto;
  padding:20px;
  background:#fffdf9;
  border:1px solid #eee3d8;
  border-radius:26px;
  box-shadow:
    0 10px 30px rgba(92,70,50,.08);
}

h2{
  margin:0 0 16px;
  color:#40352f;
  font-size:20px;
}


/* ==================================================
   日期
================================================== */

.date-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:100%;
}

.date-box{
  width:100%;
  min-width:0;
}

.date-box label{
  display:block;
  margin:0 0 7px;
  color:#9a7765;
  font-size:13px;
}


/*
   ★★★ 日期輸入框 ★★★

   這裡刻意不使用：
   - display:none
   - opacity:0
   - showPicker()
   - 隱藏 input
   - 透明按鈕

   手機直接點這個 input，
   使用手機原生日期選擇器。
*/

.date-input{
  display:block;
  width:100%;
  height:54px;
  min-height:54px;

  padding:0 12px;

  border:1px solid #eadfd5;
  border-radius:16px;

  background:#ffffff;
  color:#40352f;

  font-family:inherit;
  font-size:18px;
  font-weight:500;

  text-align:center;

  cursor:pointer;

  appearance:auto;
  -webkit-appearance:auto;

  touch-action:manipulation;
}


/* Chrome / Android */
.date-input::-webkit-calendar-picker-indicator{
  cursor:pointer;
  width:22px;
  height:22px;
  opacity:1;
}


/* iPhone / Safari */
.date-input::-webkit-datetime-edit{
  text-align:center;
}

.date-input::-webkit-date-and-time-value{
  text-align:center;
}


/* ==================================================
   人數
================================================== */

.people{
  margin-top:16px;

  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
  width:100%;
}

.person-box{
  min-width:0;
  width:100%;

  padding:12px;

  border:1px solid #eadfd5;
  border-radius:16px;

  background:#fffaf5;
}

.person-box label{
  display:block;
  margin-bottom:7px;

  color:#806b5d;
  font-size:14px;
}

select{
  width:100%;
  max-width:100%;
  min-width:0;

  height:48px;

  padding:0 10px;

  border:1px solid #eadfd5;
  border-radius:14px;

  background:#fff;

  color:#40352f;

  font-family:inherit;
  font-size:16px;
}


/* ==================================================
   小孩年齡
================================================== */

.child-ages{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;

  width:100%;
  margin-top:12px;
}

.age-item{
  width:100%;
}

.age-item label{
  display:block;

  margin-bottom:5px;

  color:#806b5d;
  font-size:12px;
}

.age-item select{
  width:100%;
  height:46px;
}


/* ==================================================
   查詢按鈕
================================================== */

.search-button{
  display:block;

  width:100%;
  height:52px;

  margin-top:16px;

  border:0;
  border-radius:14px;

  background:#7d6454;
  color:#ffffff;

  font-family:inherit;
  font-size:17px;
  font-weight:600;

  cursor:pointer;

  touch-action:manipulation;
}

.search-button:active{
  transform:scale(.99);
}


/* ==================================================
   查詢結果
================================================== */

.result{
  margin-top:14px;
  padding:16px;

  border-radius:18px;

  background:#edf7f0;
}

.result.bad{
  background:#fbe9e6;
}

.result h3{
  margin:0 0 8px;
  font-size:18px;
}

.result p{
  margin:5px 0;
  line-height:1.6;
}

.dot{
  display:inline-block;

  width:18px;
  height:18px;

  margin-right:7px;

  border-radius:50%;

  vertical-align:-3px;

  background:#49d58d;
}

.bad .dot{
  background:#e96b63;
}


/* ==================================================
   LINE
================================================== */

.line-button{
  display:block;

  width:100%;
  min-height:52px;

  margin-top:14px;

  padding:0;

  border:0;
  border-radius:15px;

  background:#06c755;
  color:#ffffff;

  font-family:inherit;
  font-size:17px;
  font-weight:700;

  line-height:52px;
  text-align:center;
  text-decoration:none;

  cursor:pointer;

  box-shadow:
    0 5px 12px rgba(6,199,85,.18);

  touch-action:manipulation;
}

.line-button.disabled{
  background:#b8b0aa;
  box-shadow:none;
  cursor:not-allowed;
}

.line-button.loading{
  background:#8e8178;
  cursor:wait;
}


/* ==================================================
   月曆
================================================== */

.calendar-card{
  padding:18px;
  margin-top:14px;
}

.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;
}

.nav{
  width:42px;
  height:42px;

  padding:0;
  margin:0;

  border:0;
  border-radius:12px;

  background:#f2ece5;
  color:#765e4e;

  font-size:22px;

  cursor:pointer;
}

.month{
  font-size:20px;
  font-weight:600;
}

.week{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:5px;

  margin-bottom:6px;

  color:#a47e6c;

  font-size:12px;

  text-align:center;
}

.days{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:5px;
}

.day{
  min-height:66px;

  padding:8px 3px;

  border-radius:13px;

  font-size:14px;

  text-align:center;
}

.day.available{
  background:#edf7f0;
}

.day.full{
  background:#fbe8e5;
  color:#a94a40;
}

.day.holiday{
  box-shadow:
    inset 0 -3px 0 #c89a36;
}

.day small{
  display:block;

  margin-top:6px;

  font-size:10px;
}

.day.empty{
  background:transparent;
}


/* ==================================================
   圖例
================================================== */

.legend{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;

  margin-top:14px;

  color:#806b5d;
  font-size:12px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:12px;
  height:12px;
  border-radius:4px;
}

.legend-green{
  background:#edf7f0;
  border:1px solid #d5e8d9;
}

.legend-red{
  background:#fbe8e5;
  border:1px solid #f0cbc5;
}

.legend-yellow{
  background:#fff7dd;
  border:1px solid #e5c66d;
}


/* ==================================================
   手機
================================================== */

@media(max-width:560px){

  .top{
    padding-top:20px;
  }

  .brand{
    font-size:26px;
  }

  .subtitle{
    font-size:13px;
  }

  .card{
    width:calc(100% - 20px);
    padding:16px;
    border-radius:22px;
  }

  .date-row{
    grid-template-columns:1fr;
    gap:12px;
  }

  /*
     手機日期框加大，
     讓整個區域都很好按
  */

  .date-input{
    width:100%;
    height:56px;
    min-height:56px;

    font-size:18px;
  }

  .people{
    grid-template-columns:
      repeat(3,1fr);

    gap:7px;
  }

  .person-box{
    padding:9px 7px;
  }

  .person-box label{
    font-size:13px;
  }

  .person-box select{
    font-size:15px;
    padding:0 6px;
  }

  .day{
    min-height:60px;
    font-size:13px;
  }

  .line-button{
    font-size:16px;
  }
}


/* ==================================================
   更小手機
================================================== */

@media(max-width:380px){

  .card{
    width:calc(100% - 14px);
    padding:13px;
  }

  .people{
    gap:5px;
  }

  .person-box{
    padding:8px 5px;
  }

  .person-box label{
    font-size:12px;
  }

  .person-box select{
    font-size:14px;
  }

  .date-input{
    font-size:17px;
  }

  .day{
    min-height:55px;
    padding:6px 2px;
    font-size:12px;
  }

}

</style>

</head>


<body>


<!-- ==================================================
     頁首
================================================== -->

<section class="card">

<script>

/* ==================================================
   Google Apps Script API
================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyk2rGhw0sSKTl6BrKBN1-shZzJ0yWYsZjmDazgRHvWM1gFEyuYZ_vqFRTDh06FOkYV7g/exec";


/* ==================================================
   LINE
================================================== */

const LINE_ID =
"@812xoprs";


/* ==================================================
   全域資料
================================================== */

let calendarData = [];

let viewDate = new Date();


/* ==================================================
   日期工具
================================================== */

function pad(n){

  return String(n).padStart(2,"0");

}


function key(year,month,date){

  return (
    year +
    "-" +
    pad(month + 1) +
    "-" +
    pad(date)
  );

}


function formatDate(value){

  return value.replaceAll(
    "-",
    "/"
  );

}


/* ==================================================
   日期顯示更新
================================================== */

function updateDateDisplay(id){

  const input =
    document.getElementById(id);

  if(!input){
    return;
  }


  /*
     只要日期改變，
     就同步月曆。
  */

  if(input.value){

    syncCalendarToDate(
      input.value
    );

  }


  /*
     日期變更後重新判斷 LINE。
  */

  updateLineButtonState();

}


/* ==================================================
   同步月曆到日期
================================================== */

function syncCalendarToDate(dateString){

  if(!dateString){
    return;
  }


  const parts =
    dateString.split("-");


  if(parts.length !== 3){
    return;
  }


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]) - 1;


  viewDate =
    new Date(
      year,
      month,
      1
    );


  renderCalendar();

}


/* ==================================================
   小孩年齡
================================================== */

function renderChildAges(){

  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const box =
    document.getElementById(
      "childAges"
    );


  box.innerHTML = "";


  for(
    let i = 1;
    i <= children;
    i++
  ){

    const wrap =
      document.createElement(
        "div"
      );


    wrap.className =
      "age-item";


    const label =
      document.createElement(
        "label"
      );


    label.textContent =
      "第 " +
      i +
      " 位小孩年齡";


    const select =
      document.createElement(
        "select"
      );


    select.className =
      "child-age";


    for(
      let age = 0;
      age <= 7;
      age++
    ){

      const option =
        document.createElement(
          "option"
        );


      option.value =
        age;


      option.textContent =
        age +
        " 歲";


      select.appendChild(
        option
      );

    }


    wrap.appendChild(
      label
    );


    wrap.appendChild(
      select
    );


    box.appendChild(
      wrap
    );

  }

}


/* ==================================================
   取得小孩年齡
================================================== */

function getChildAges(){

  return [
    ...document.querySelectorAll(
      ".child-age"
    )
  ].map(
    item => Number(
      item.value
    )
  );

}


/* ==================================================
   判斷是否碰到已訂日期
================================================== */

function hasBookedDate(
  checkin,
  checkout
){

  if(
    !checkin ||
    !checkout
  ){

    return false;

  }


  const start =
    new Date(
      checkin +
      "T00:00:00"
    );


  const end =
    new Date(
      checkout +
      "T00:00:00"
    );


  for(
    let d = new Date(start);

    d < end;

    d.setDate(
      d.getDate() + 1
    )
  ){

    const dateKey =
      key(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );


    const item =
      calendarData.find(
        x =>
          x.date === dateKey
      );


    if(
      item &&
      (
        item.status === "已訂" ||
        item.status === "已訂滿"
      )
    ){

      return true;

    }

  }


  return false;

}


/* ==================================================
   更新 LINE 按鈕
================================================== */

function updateLineButtonState(){

  const button =
    document.getElementById(
      "lineButton"
    );


  if(!button){
    return;
  }


  const checkin =
    document.getElementById(
      "checkin"
    ).value;


  const checkout =
    document.getElementById(
      "checkout"
    ).value;


  button.classList.remove(
    "disabled"
  );


  if(
    !checkin ||
    !checkout
  ){

    button.disabled = false;

    button.textContent =
      "💚 立即 LINE 詢問訂房";

    return;

  }


  if(
    checkout <= checkin
  ){

    button.disabled = true;

    button.classList.add(
      "disabled"
    );

    button.textContent =
      "🔒 請先確認住宿日期";

    return;

  }


  if(
    hasBookedDate(
      checkin,
      checkout
    )
  ){

    button.disabled = true;

    button.classList.add(
      "disabled"
    );

    button.textContent =
      "🔒 此日期無法訂房";

    return;

  }


  button.disabled = false;

  button.textContent =
    "💚 立即 LINE 詢問訂房";

}


/* ==================================================
   載入房況
================================================== */

function loadCalendar(){

  return new Promise(
    (resolve,reject) => {

      const callbackName =
        "calendarCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      window[callbackName] =
        function(data){

          try{

            calendarData =
              Array.isArray(data)
              ? data
              : [];


            renderCalendar();

            updateLineButtonState();

            resolve(data);

          }
          finally{

            delete window[
              callbackName
            ];

            script.remove();

          }

        };


      script.src =
        API +
        "?action=calendar" +
        "&callback=" +
        callbackName;


      script.onerror =
        function(){

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              "API讀取失敗"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* ==================================================
   查詢指定住宿日期
================================================== */

function checkBookingJSONP(
  checkin,
  checkout
){

  return new Promise(
    (resolve,reject) => {

      const callbackName =
        "checkCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      window[callbackName] =
        function(data){

          try{

            resolve(data);

          }
          finally{

            delete window[
              callbackName
            ];

            script.remove();

          }

        };


      script.src =
        API +
        "?action=check" +
        "&checkin=" +
        encodeURIComponent(
          checkin
        ) +
        "&checkout=" +
        encodeURIComponent(
          checkout
        ) +
        "&callback=" +
        callbackName;


      script.onerror =
        function(){

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              "API查詢失敗"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* ==================================================
   渲染月曆
================================================== */

function renderCalendar(){

  const year =
    viewDate.getFullYear();


  const month =
    viewDate.getMonth();


  document.getElementById(
    "monthTitle"
  ).textContent =
    year +
    " 年 " +
    (month + 1) +
    " 月";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const totalDays =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const map = {};


  calendarData.forEach(
    item => {

      map[item.date] =
        item;

    }
  );


  const box =
    document.getElementById(
      "days"
    );


  box.innerHTML = "";


  /*
     月初空白
  */

  for(
    let i = 0;
    i < firstDay;
    i++
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day empty";


    box.appendChild(
      empty
    );

  }


  /*
     每一天
  */

  for(
    let day = 1;
    day <= totalDays;
    day++
  ){

    const dateKey =
      key(
        year,
        month,
        day
      );


    const item =
      map[dateKey] ||
      {
        status:"可訂房",
        type:"平日"
      };


    const full =
      item.status === "已訂" ||
      item.status === "已訂滿";


    const element =
      document.createElement(
        "div"
      );


    element.className =
      "day " +
      (
        full
        ? "full"
        : "available"
      ) +
      (
        item.type === "假日"
        ? " holiday"
        : ""
      );


    element.innerHTML =

      day +

      "<small>" +

      (
        full
        ? "已滿"
        : "可預訂"
      ) +

      (
        item.type === "假日"
        ? "・假日"
        : ""
      ) +

      "</small>";


    box.appendChild(
      element
    );

  }

}


/* ==================================================
   換月份
================================================== */

function changeMonth(step){

  viewDate =
    new Date(
      viewDate.getFullYear(),
      viewDate.getMonth() + step,
      1
    );


  renderCalendar();

}


/* ==================================================
   計算晚數
================================================== */

function calculateNights(
  checkin,
  checkout
){

  const start =
    new Date(
      checkin +
      "T00:00:00"
    );


  const end =
    new Date(
      checkout +
      "T00:00:00"
    );


  let nights = 0;


  for(
    let d = new Date(start);

    d < end;

    d.setDate(
      d.getDate() + 1
    )
  ){

    nights++;

  }


  return nights;

}


/* ==================================================
   LINE 訂房
================================================== */

async function openLineBooking(event){

  if(event){
    event.preventDefault();
  }


  const button =
    document.getElementById(
      "lineButton"
    );


  const checkin =
    document.getElementById(
      "checkin"
    ).value;


  const checkout =
    document.getElementById(
      "checkout"
    ).value;


  const adults =
    Number(
      document.getElementById(
        "adults"
      ).value
    );


  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const pets =
    Number(
      document.getElementById(
        "pets"
      ).value
    );


  const ages =
    getChildAges();


  /*
     日期檢查
  */

  if(
    !checkin ||
    !checkout
  ){

    alert(
      "請先選擇入住與退房日期"
    );

    return;

  }


  if(
    checkout <= checkin
  ){

    alert(
      "退房日期需晚於入住日期"
    );

    return;

  }


  /*
     先檢查目前已載入資料
  */

  if(
    hasBookedDate(
      checkin,
      checkout
    )
  ){

    alert(
      "這段住宿期間已有滿房日期，請重新選擇。"
    );

    updateLineButtonState();

    return;

  }


  /*
     即時確認
  */

  button.disabled = true;

  button.classList.add(
    "loading"
  );

  button.textContent =
    "🔍 正在確認房況...";


  try{

    const data =
      await checkBookingJSONP(
        checkin,
        checkout
      );


    if(
      !data ||
      !data.available
    ){

      button.disabled = true;

      button.classList.remove(
        "loading"
      );

      button.classList.add(
        "disabled"
      );

      button.textContent =
        "🔒 此日期無法訂房";


      alert(
        "這段住宿期間已有滿房日期，請重新選擇。"
      );

      return;

    }


    /*
       可以訂房
    */

    const nights =
      calculateNights(
        checkin,
        checkout
      );


    let childrenText =
      "🧒 小孩：0位";


    if(children > 0){

      childrenText =
        "🧒 小孩：" +
        children +
        "位";


      if(ages.length > 0){

        childrenText +=
          "（" +
          ages.join("、") +
          "歲）";

      }

    }


    const message =

`🏡 香草貝兒訂房詢問
📅 入住：${formatDate(checkin)}
📅 退房：${formatDate(checkout)}
🌙 住宿：${nights}晚
👨 大人：${adults}位
${childrenText}
🐶 毛孩：${pets}隻

想詢問以上日期是否可以訂房，謝謝！`;


    const encodedLineID =
      encodeURIComponent(
        LINE_ID
      );


    const encodedMessage =
      encodeURIComponent(
        message
      );


    const lineURL =
      "https://line.me/R/oaMessage/" +
      encodedLineID +
      "/?" +
      encodedMessage;


    window.location.href =
      lineURL;

  }


  catch(error){

    console.error(error);


    button.disabled = false;

    button.classList.remove(
      "loading"
    );

    updateLineButtonState();


    alert(
      "目前無法確認房況，請稍後再試。"
    );

  }

}


/* ==================================================
   查詢房況
================================================== */

async function checkBooking(){

  const checkin =
    document.getElementById(
      "checkin"
    ).value;


  const checkout =
    document.getElementById(
      "checkout"
    ).value;


  const adults =
    Number(
      document.getElementById(
        "adults"
      ).value
    );


  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const pets =
    Number(
      document.getElementById(
        "pets"
      ).value
    );


  const ages =
    getChildAges();


  const result =
    document.getElementById(
      "result"
    );


  /*
     日期檢查
  */

  if(
    !checkin ||
    !checkout
  ){

    result.innerHTML = `

      <div class="result bad">

        <h3>
          ⚠️ 請選擇入住與退房日期
        </h3>

      </div>

    `;

    return;

  }


  if(
    checkout <= checkin
  ){

    result.innerHTML = `

      <div class="result bad">

        <h3>
          ⚠️ 退房日期需晚於入住日期
        </h3>

      </div>

    `;

    updateLineButtonState();

    return;

  }


  /*
     月曆跳到入住月份
  */

  syncCalendarToDate(
    checkin
  );


  /*
     查詢中
  */

  result.innerHTML = `

    <div class="result">

      <h3>
        🔍 正在確認房況...
      </h3>

      <p>
        請稍候。
      </p>

    </div>

  `;


  try{

    const data =
      await checkBookingJSONP(
        checkin,
        checkout
      );


    /*
       計算晚數
    */

    const start =
      new Date(
        checkin +
        "T00:00:00"
      );


    const end =
      new Date(
        checkout +
        "T00:00:00"
      );


    let nights = 0;

    let holidayNights = 0;

    let weekdayNights = 0;


    const map = {};


    calendarData.forEach(
      item => {

        map[item.date] =
          item;

      }
    );


    for(
      let d = new Date(start);

      d < end;

      d.setDate(
        d.getDate() + 1
      )
    ){

      nights++;


      const dateKey =
        key(
          d.getFullYear(),
          d.getMonth(),
          d.getDate()
        );


      if(
        map[dateKey] &&
        map[dateKey].type === "假日"
      ){

        holidayNights++;

      }
      else{

        weekdayNights++;

      }

    }


    const agesText =
      children > 0
      ? "，小孩年齡：" +
        ages.join("、") +
        " 歲"
      : "";


    /*
       無法訂房
    */

    if(
      !data ||
      !data.available
    ){

      result.innerHTML = `

        <div class="result bad">

          <h3>

            <span class="dot"></span>

            目前無法訂房

          </h3>

          <p>

            ${formatDate(checkin)}

            ～ 

            ${formatDate(checkout)}

            的住宿期間已有已訂日期。

          </p>

          <p>

            大人 ${adults} 位

            ・

            小孩 ${children} 位

            ${agesText}

            ・

            毛孩 ${pets} 隻

          </p>

        </div>

      `;


      updateLineButtonState();

      return;

    }


    /*
       可以訂房
    */

    result.innerHTML = `

      <div class="result">

        <h3>

          <span class="dot"></span>

          可以訂房

        </h3>

        <p>

          ${formatDate(checkin)}

          ～ 

          ${formatDate(checkout)}

          共

          <b>
            ${nights} 晚
          </b>

        </p>

        <p>

          大人 ${adults} 位

          ・

          小孩 ${children} 位

          ${agesText}

          ・

          毛孩 ${pets} 隻

        </p>

        <p>

          平日 ${weekdayNights} 晚

          ・

          假日 ${holidayNights} 晚

        </p>

        <p>
          本次住宿期間目前皆可預訂。
        </p>

      </div>

    `;


    updateLineButtonState();

  }


  catch(error){

    console.error(error);


    result.innerHTML = `

      <div class="result bad">

        <h3>
          ⚠️ 查詢失敗
        </h3>

        <p>
          請稍後再試。
        </p>

      </div>

    `;

  }

}


/* ==================================================
   設定預設日期
================================================== */

function setDefaultDates(){

  const now =
    new Date();


  const today =
    now.getFullYear() +
    "-" +
    pad(now.getMonth() + 1) +
    "-" +
    pad(now.getDate());


  document.getElementById(
    "checkin"
  ).value =
    today;


  const tomorrow =
    new Date(now);


  tomorrow.setDate(
    tomorrow.getDate() + 1
  );


  const tomorrowString =
    tomorrow.getFullYear() +
    "-" +
    pad(tomorrow.getMonth() + 1) +
    "-" +
    pad(tomorrow.getDate());


  document.getElementById(
    "checkout"
  ).value =
    tomorrowString;

}

================================================== */
