<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#f8f5f0"
>

<title>香草貝兒｜房況查詢</title>


<style>

/* ==================================================
   基本設定
================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

body{
  background:#f8f5f0;
  color:#4b3b32;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  -webkit-text-size-adjust:100%;
}


/* ==================================================
   頁首
================================================== */

.top{
  width:100%;

  padding:
    24px
    12px
    12px;

  text-align:center;
}

.brand{
  margin-bottom:6px;

  color:#6f5546;

  font-size:28px;
  font-weight:700;

  letter-spacing:4px;

  line-height:1.3;
}

.subtitle{
  color:#987d6d;

  font-size:14px;

  letter-spacing:1px;

  line-height:1.5;
}


/* ==================================================
   卡片
================================================== */

.card{
  width:
    min(
      650px,
      calc(100% - 24px)
    );

  max-width:650px;

  margin:
    12px
    auto;

  padding:20px;

  background:#fffdf9;

  border:
    1px
    solid
    #eee3d8;

  border-radius:26px;

  box-shadow:
    0
    10px
    30px
    rgba(92,70,50,.08);

  overflow:hidden;
}


/* ==================================================
   標題
================================================== */

h2{
  margin:
    0
    0
    16px;

  color:#40352f;

  font-size:20px;
  font-weight:700;

  line-height:1.4;
}


/* ==================================================
   日期區
================================================== */

.date-row{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;

  width:100%;
  max-width:100%;

  min-width:0;
}

.date-box{

  position:relative;

  width:100%;
  max-width:100%;

  min-width:0;

  overflow:hidden;
}

.date-box > label{

  display:block;

  width:100%;

  margin:
    0
    0
    7px;

  color:#9a7765;

  font-size:16px;

  line-height:1.4;
}


/* ==================================================
   日期輸入框
================================================== */

.date-input{

  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  height:56px;
  min-height:56px;

  margin:0;

  padding:
    0
    42px
    0
    12px;

  border:
    1px
    solid
    #eadfd5;

  border-radius:16px;

  background:#ffffff;

  color:#40352f;

  font-family:inherit;

  font-size:18px;
  font-weight:500;

  line-height:56px;

  text-align:center;

  box-sizing:border-box;

  cursor:pointer;

  appearance:none;
  -webkit-appearance:none;

  touch-action:manipulation;

  outline:none;
}


/* ==================================================
   日期框 focus
================================================== */

.date-input:focus{

  border-color:#c9b2a2;

  outline:none;

  box-shadow:
    0
    0
    0
    3px
    rgba(125,100,84,.08);
}


/* ==================================================
   iPhone Safari 日期文字
================================================== */

.date-input::-webkit-date-and-time-value{

  height:56px;

  line-height:56px;

  text-align:center;
}


/* ==================================================
   iPhone Safari 日期編輯區
================================================== */

.date-input::-webkit-datetime-edit{

  padding:0;

  text-align:center;
}

.date-input::-webkit-datetime-edit-fields-wrapper{

  display:flex;

  justify-content:center;

  align-items:center;

  width:100%;

  height:56px;

  text-align:center;
}


/* ==================================================
   日期各欄位置中
================================================== */

.date-input::-webkit-datetime-edit-year-field,
.date-input::-webkit-datetime-edit-month-field,
.date-input::-webkit-datetime-edit-day-field{

  text-align:center;
}


/* ==================================================
   隱藏 iPhone / Safari 原生日曆圖示
   ★ 重要
================================================== */

.date-input::-webkit-calendar-picker-indicator{

  opacity:0;

  position:absolute;

  right:0;

  width:50px;
  height:100%;

  cursor:pointer;
}


/* ==================================================
   自己放唯一一個日期圖示
================================================== */

.date-box::after{

  content:"📅";

  position:absolute;

  right:14px;
  bottom:17px;

  width:22px;
  height:22px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:18px;

  line-height:1;

  pointer-events:none;
}


/* ==================================================
   人數
================================================== */

.people{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;

  width:100%;
  max-width:100%;

  margin-top:16px;
}

.person-box{

  width:100%;
  max-width:100%;

  min-width:0;

  padding:12px;

  border:
    1px
    solid
    #eadfd5;

  border-radius:16px;

  background:#fffaf5;

  overflow:hidden;
}

.person-box > label{

  display:block;

  width:100%;

  margin:
    0
    0
    7px;

  color:#806b5d;

  font-size:14px;

  line-height:1.4;
}


/* ==================================================
   下拉選單
================================================== */

select{

  display:block;

  width:100%;
  max-width:100%;

  min-width:0;

  height:48px;

  margin:0;

  padding:
    0
    10px;

  border:
    1px
    solid
    #eadfd5;

  border-radius:14px;

  background:#ffffff;

  color:#40352f;

  font-family:inherit;

  font-size:16px;

  line-height:48px;

  box-sizing:border-box;
}


/* ==================================================
   小孩年齡
================================================== */

.child-ages{

  display:grid;

  grid-template-columns:
    1fr;

  gap:10px;

  width:100%;

  margin-top:12px;
}

.age-item{

  width:100%;
  max-width:100%;

  min-width:0;
}

.age-item label{

  display:block;

  margin:
    0
    0
    5px;

  color:#806b5d;

  font-size:12px;
}

.age-item select{

  width:100%;

  height:46px;

  line-height:46px;
}


/* ==================================================
   查詢按鈕
================================================== */

.search-button{

  display:block;

  width:100%;

  height:52px;

  margin-top:16px;

  padding:0;

  border:0;

  border-radius:14px;

  background:#7d6454;

  color:#ffffff;

  font-family:inherit;

  font-size:17px;

  font-weight:600;

  line-height:52px;

  text-align:center;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

.search-button:active{

  transform:scale(.99);
}


/* ==================================================
   查詢結果
================================================== */

.result{

  width:100%;

  margin-top:14px;

  padding:16px;

  border-radius:18px;

  background:#edf7f0;
}

.result.bad{

  background:#fbe9e6;
}

.result h3{

  margin:
    0
    0
    8px;

  font-size:18px;

  line-height:1.5;
}

.result p{

  margin:
    5px
    0;

  line-height:1.6;
}

.dot{

  display:inline-block;

  width:18px;
  height:18px;

  margin-right:7px;

  border-radius:50%;

  vertical-align:-3px;

  background:#49d58d;
}

.bad .dot{

  background:#e96b63;
}


/* ==================================================
   LINE
================================================== */

.line-button{

  display:block;

  width:100%;

  min-height:52px;

  margin-top:14px;

  padding:0;

  border:0;

  border-radius:15px;

  background:#06c755;

  color:#ffffff;

  font-family:inherit;

  font-size:17px;

  font-weight:700;

  line-height:52px;

  text-align:center;

  text-decoration:none;

  cursor:pointer;

  box-shadow:
    0
    5px
    12px
    rgba(6,199,85,.18);

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

.line-button.disabled{

  background:#b8b0aa;

  color:#ffffff;

  box-shadow:none;

  cursor:not-allowed;
}

.line-button.loading{

  background:#8e8178;

  cursor:wait;
}


/* ==================================================
   月曆
================================================== */

.calendar-card{

  width:
    min(
      650px,
      calc(100% - 24px)
    );

  padding:18px;

  margin:
    14px
    auto;

  overflow:hidden;
}

.cal-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  width:100%;

  margin-bottom:10px;
}

.nav{

  flex:
    0
    0
    42px;

  width:42px;
  height:42px;

  margin:0;
  padding:0;

  border:0;

  border-radius:12px;

  background:#f2ece5;

  color:#765e4e;

  font-size:22px;

  line-height:42px;

  text-align:center;

  cursor:pointer;
}

.month{

  flex:1;

  text-align:center;

  color:#40352f;

  font-size:20px;

  font-weight:600;

  line-height:42px;
}


/* ==================================================
   星期
================================================== */

.week{

  display:grid;

  grid-template-columns:
    repeat(7,minmax(0,1fr));

  gap:5px;

  width:100%;

  margin-bottom:6px;

  color:#a47e6c;

  font-size:12px;

  text-align:center;
}


/* ==================================================
   日期格
================================================== */

.days{

  display:grid;

  grid-template-columns:
    repeat(7,minmax(0,1fr));

  gap:5px;

  width:100%;
}

.day{

  width:100%;
  min-width:0;

  min-height:66px;

  padding:
    8px
    3px;

  border-radius:13px;

  font-size:14px;

  line-height:1.4;

  text-align:center;

  overflow:hidden;
}

.day.available{

  background:#edf7f0;
}

.day.full{

  background:#fbe8e5;

  color:#a94a40;
}

.day.holiday{

  box-shadow:
    inset
    0
    -3px
    0
    #c89a36;
}

.day small{

  display:block;

  margin-top:6px;

  font-size:10px;

  line-height:1.3;
}

.day.empty{

  background:transparent;
}


/* ==================================================
   圖例
================================================== */

.legend{

  display:flex;

  justify-content:center;

  align-items:center;

  flex-wrap:wrap;

  gap:14px;

  margin-top:14px;

  color:#806b5d;

  font-size:12px;
}

.legend-item{

  display:flex;

  align-items:center;

  gap:5px;
}

.legend-dot{

  width:12px;
  height:12px;

  border-radius:4px;
}

.legend-green{

  background:#edf7f0;

  border:
    1px
    solid
    #d5e8d9;
}

.legend-red{

  background:#fbe8e5;

  border:
    1px
    solid
    #f0cbc5;
}

.legend-yellow{

  background:#fff7dd;

  border:
    1px
    solid
    #e5c66d;
}


/* ==================================================
   手機版
================================================== */

@media(max-width:560px){

  .top{

    padding:
      20px
      10px
      12px;
  }

  .brand{

    font-size:26px;

    letter-spacing:3px;
  }

  .subtitle{

    font-size:13px;
  }


  /* 卡片 */

  .card{

    width:
      calc(100% - 20px);

    max-width:
      calc(100% - 20px);

    margin:
      12px
      auto;

    padding:16px;

    border-radius:22px;
  }


  /* 日期上下排列 */

  .date-row{

    display:grid;

    grid-template-columns:
      minmax(0,1fr);

    gap:12px;

    width:100%;
    max-width:100%;
  }


  .date-box{

    width:100%;
    max-width:100%;

    min-width:0;

    overflow:hidden;
  }


  .date-input{

    width:100%;
    max-width:100%;

    height:56px;
    min-height:56px;

    padding:
      0
      42px
      0
      12px;

    font-size:18px;

    line-height:56px;
  }


  .date-input::-webkit-date-and-time-value{

    height:56px;

    line-height:56px;
  }


  /* 自己的日期圖示 */

  .date-box::after{

    right:14px;

    bottom:17px;

    font-size:18px;
  }


  /* 人數三欄 */

  .people{

    grid-template-columns:
      repeat(3,minmax(0,1fr));

    gap:7px;

    width:100%;
  }


  .person-box{

    padding:
      9px
      7px;
  }


  .person-box > label{

    font-size:13px;
  }


  .person-box select{

    height:48px;

    padding:
      0
      6px;

    font-size:15px;
  }


  /* 月曆 */

  .calendar-card{

    width:
      calc(100% - 20px);

    max-width:
      calc(100% - 20px);

    padding:14px;
  }


  .day{

    min-height:60px;

    padding:
      7px
      2px;

    font-size:13px;
  }


  .day small{

    font-size:9px;
  }


  .line-button{

    font-size:16px;
  }

}


/* ==================================================
   小手機
================================================== */

@media(max-width:380px){

  .card{

    width:
      calc(100% - 14px);

    max-width:
      calc(100% - 14px);

    padding:13px;
  }


  .people{

    gap:5px;
  }


  .person-box{

    padding:
      8px
      5px;
  }


  .person-box > label{

    font-size:12px;
  }


  .person-box select{

    font-size:14px;
  }


  .date-input{

    font-size:17px;
  }


  .day{

    min-height:55px;

    padding:
      6px
      2px;

    font-size:12px;
  }

}

</style>

</head>


<body>


<!-- ==================================================
     頁首
================================================== -->

<header class="top">

  <div class="brand">
    🌿 香草貝兒
  </div>

  <div class="subtitle">
    寵物友善包棟民宿｜房況查詢
  </div>

</header>



<!-- ==================================================
     查詢區
================================================== -->

<section class="card">

  <h2>
    🗓️ 查詢住宿日期
  </h2>


  <!-- ================================================
       日期
  ================================================ -->

  <div class="date-row">


    <!-- 入住 -->

    <div class="date-box">

      <label for="checkin">
        入住日期
      </label>

      <input
        id="checkin"
        class="date-input"
        type="date"
        aria-label="入住日期"
        onchange="updateDateDisplay('checkin')"
      >

    </div>


    <!-- 退房 -->

    <div class="date-box">

      <label for="checkout">
        退房日期
      </label>

      <input
        id="checkout"
        class="date-input"
        type="date"
        aria-label="退房日期"
        onchange="updateDateDisplay('checkout')"
      >

    </div>

  </div>



  <!-- ================================================
       人數
  ================================================ -->

  <div class="people">


    <!-- 大人 -->

    <div class="person-box">

      <label for="adults">
        👨 大人
      </label>

      <select id="adults">

        <option value="1">
          1 位
        </option>

        <option value="2" selected>
          2 位
        </option>

        <option value="3">
          3 位
        </option>

        <option value="4">
          4 位
        </option>

        <option value="5">
          5 位
        </option>

        <option value="6">
          6 位
        </option>

        <option value="7">
          7 位
        </option>

        <option value="8">
          8 位
        </option>

      </select>

    </div>


    <!-- 小孩 -->

    <div class="person-box">

      <label for="children">
        🧒 小孩
      </label>

      <select
        id="children"
        onchange="renderChildAges()"
      >

        <option value="0" selected>
          0 位
        </option>

        <option value="1">
          1 位
        </option>

        <option value="2">
          2 位
        </option>

        <option value="3">
          3 位
        </option>

        <option value="4">
          4 位
        </option>

        <option value="5">
          5 位
        </option>

        <option value="6">
          6 位
        </option>

        <option value="7">
          7 位
        </option>

        <option value="8">
          8 位
        </option>

      </select>

    </div>


    <!-- 毛孩 -->

    <div class="person-box">

      <label for="pets">
        🐶 毛孩
      </label>

      <select id="pets">

        <option value="0" selected>
          0 隻
        </option>

        <option value="1">
          1 隻
        </option>

        <option value="2">
          2 隻
        </option>

        <option value="3">
          3 隻
        </option>

        <option value="4">
          4 隻
        </option>

        <option value="5">
          5 隻
        </option>

        <option value="6">
          6 隻
        </option>

        <option value="7">
          7 隻
        </option>

        <option value="8">
          8 隻
        </option>

      </select>

    </div>

  </div>



  <!-- ================================================
       小孩年齡
  ================================================ -->

  <div
    id="childAges"
    class="child-ages"
  ></div>



  <!-- ================================================
       查詢
  ================================================ -->

  <button
    type="button"
    class="search-button"
    onclick="checkBooking()"
  >
    🔍 查詢房況
  </button>



  <!-- ================================================
       查詢結果
  ================================================ -->

  <div id="result"></div>



  <!-- ================================================
       LINE
  ================================================ -->

  <button
    id="lineButton"
    type="button"
    class="line-button"
    onclick="openLineBooking(event)"
  >
    💚 立即 LINE 詢問訂房
  </button>

</section>



<!-- ==================================================
     月曆
================================================== -->

<section class="card calendar-card">


  <div class="cal-head">


    <button
      type="button"
      class="nav"
      onclick="changeMonth(-1)"
      aria-label="上一個月"
    >
      ‹
    </button>


    <div
      id="monthTitle"
      class="month"
    >
      載入中
    </div>


    <button
      type="button"
      class="nav"
      onclick="changeMonth(1)"
      aria-label="下一個月"
    >
      ›
    </button>


  </div>



  <!-- 星期 -->

  <div class="week">

    <div>日</div>
    <div>一</div>
    <div>二</div>
    <div>三</div>
    <div>四</div>
    <div>五</div>
    <div>六</div>

  </div>



  <!-- 日期 -->

  <div
    id="days"
    class="days"
  ></div>



  <!-- 圖例 -->

  <div class="legend">


    <div class="legend-item">

      <span
        class="legend-dot legend-green"
      ></span>

      可預訂

    </div>


    <div class="legend-item">

      <span
        class="legend-dot legend-red"
      ></span>

      已滿房

    </div>


    <div class="legend-item">

      <span
        class="legend-dot legend-yellow"
      ></span>

      假日

    </div>


  </div>

</section>



<script>

/* ==================================================
   Google Apps Script API
================================================== */

const API =
"https://script.google.com/macros/s/AKfycbyk2rGhw0sSKTl6BrKBN1-shZzJ0yWYsZjmDazgRHvWM1gFEyuYZ_vqFRTDh06FOkYV7g/exec";


/* ==================================================
   LINE
================================================== */

const LINE_ID =
"@812xoprs";


/* ==================================================
   全域資料
================================================== */

let calendarData = [];

let viewDate =
  new Date();


/* ==================================================
   日期工具
================================================== */

function pad(number){

  return String(
    number
  ).padStart(
    2,
    "0"
  );

}


function key(
  year,
  month,
  date
){

  return (
    year +
    "-" +
    pad(month + 1) +
    "-" +
    pad(date)
  );

}


function formatDate(
  value
){

  return value.replaceAll(
    "-",
    "/"
  );

}


/* ==================================================
   日期改變
================================================== */

function updateDateDisplay(
  id
){

  const input =
    document.getElementById(
      id
    );


  if(!input){
    return;
  }


  if(input.value){

    syncCalendarToDate(
      input.value
    );

  }


  updateLineButtonState();

}


/* ==================================================
   月曆同步
================================================== */

function syncCalendarToDate(
  dateString
){

  if(!dateString){
    return;
  }


  const parts =
    dateString.split("-");


  if(
    parts.length !== 3
  ){

    return;

  }


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]) - 1;


  viewDate =
    new Date(
      year,
      month,
      1
    );


  renderCalendar();

}


/* ==================================================
   小孩年齡
================================================== */

function renderChildAges(){

  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const box =
    document.getElementById(
      "childAges"
    );


  box.innerHTML = "";


  for(
    let i = 1;
    i <= children;
    i++
  ){

    const wrap =
      document.createElement(
        "div"
      );


    wrap.className =
      "age-item";

/* ==================================================
   判斷住宿期間是否碰到已訂日期
================================================== */

function hasBookedDate(
  checkin,
  checkout
){

  if(
    !checkin ||
    !checkout
  ){

    return false;

  }


  const start =
    new Date(
      checkin +
      "T00:00:00"
    );


  const end =
    new Date(
      checkout +
      "T00:00:00"
    );


  for(
    let d =
      new Date(start);

    d < end;

    d.setDate(
      d.getDate() + 1
    )
  ){

    const dateKey =
      key(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
      );


    const item =
      calendarData.find(
        x =>
          x.date === dateKey
      );


    if(
      item &&
      (
        item.status === "已訂" ||
        item.status === "已訂滿"
      )
    ){

      return true;

    }

  }


  return false;

}

function updateLineButtonState(){

  const button =

  const checkin =
    document.getElementById(
      "checkin"
    ).value;

    ).value;


  button.classList.remove(

  );

    !checkout
  ){

    button.classList.add(
      "disabled"
    );

  if(

  ){

    button.disabled =
      true;

    button.classList.add(
      "disabled"
    );

    button.textContent =

  button.disabled =

}


/* ==================================================
   載入月曆
================================================== */

function loadCalendar(){

  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callbackName =
        "calendarCallback_" +
        Date.now();


      const script =
        document.createElement(
          "script"
        );


      window[callbackName] =
        function(data){

          try{

            calendarData =
              Array.isArray(data)
              ? data
              : [];


            renderCalendar();

            updateLineButtonState();

            resolve(data);

          }

          finally{

            delete window[
              callbackName
            ];

            script.remove();

          }

        };


      script.src =
        API +
        "?action=calendar" +
        "&callback=" +
        callbackName;


      script.onerror =
        function(){

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              "API讀取失敗"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}

/* ==================================================
   渲染月曆
================================================== */

function renderCalendar(){

  const year =
    viewDate.getFullYear();


  const month =
    viewDate.getMonth();


  document.getElementById(
    "monthTitle"
  ).textContent =
    year +
    " 年 " +
    (month + 1) +
    " 月";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const totalDays =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const map = {};


  calendarData.forEach(
    item => {

      map[item.date] =
        item;

    }
  );


  const box =
    document.getElementById(
      "days"
    );


  box.innerHTML = "";


  for(
    let i = 0;
    i < firstDay;
    i++
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day empty";


    box.appendChild(
      empty
    );

  }


  for(
    let day = 1;
    day <= totalDays;
    day++
  ){

    const dateKey =
      key(
        year,
        month,
        day
      );


    const item =
      map[dateKey] ||
      {
        status:"可訂房",
        type:"平日"
      };


    const full =
      item.status === "已訂" ||
      item.status === "已訂滿";


    const element =
      document.createElement(
        "div"
      );


    element.className =
      "day " +
      (
        full
        ? "full"
        : "available"
      ) +
      (
        item.type === "假日"
        ? " holiday"
        : ""
      );


    element.innerHTML =

      day +

      "<small>" +

      (
        full
        ? "已滿"
        : "可預訂"
      ) +

      (
        item.type === "假日"
        ? "・假日"
        : ""
      ) +

      "</small>";


    box.appendChild(
      element
    );

  }

}

   換月份
================================================== */

function changeMonth(
  step
){

  viewDate =
    new Date(
      viewDate.getFullYear(),
      viewDate.getMonth() + step,
      1
    );


  renderCalendar();

}


/* ==================================================
   計算住宿晚數
================================================== */

function calculateNights(
  checkin,
  checkout
){

  const start =
    new Date(
      checkin +
      "T00:00:00"
    );


  const end =
    new Date(
      checkout +
      "T00:00:00"
    );


  let nights = 0;


  for(
    let d =
      new Date(start);

    d < end;

    d.setDate(
      d.getDate() + 1
    )
  ){

    nights++;

  }


  return nights;

}


/* ==================================================
   LINE 訂房
================================================== */

async function openLineBooking(
  event
){

  if(event){

    event.preventDefault();

  }


  const button =
    document.getElementById(
      "lineButton"
    );


  const checkin =
    document.getElementById(
      "checkin"
    ).value;


  const checkout =
    document.getElementById(
      "checkout"
    ).value;


  const adults =
    Number(
      document.getElementById(
        "adults"
      ).value
    );


  const children =
    Number(
      document.getElementById(
        "children"
      ).value
    );


  const pets =
    Number(
      document.getElementById(
        "pets"
      ).value
    );


  const ages =
    getChildAges();


  if(
    !checkin ||
    !checkout
  ){

    alert(
      "請先選擇入住與退房日期"
    );

    return;

  }


  if(
    checkout <= checkin
  ){

    alert(
      "退房日期需晚於入住日期"
    );

    return;

  }


  if(
    hasBookedDate(
      checkin,
      checkout
    )
  ){

    alert(
      "這段住宿期間已有滿房日期，請重新選擇。"
    );

    updateLineButtonState();

    return;

  }


  button.disabled =
    true;

  button.classList.add(
    "loading"
  );

  button.textContent =
    "🔍 正在確認房況...";


  try{

    const data =
      await checkBookingJSONP(
        checkin,
        checkout
      );


    if(
      !data ||
      !data.available
    ){

      button.disabled =
        true;

      button.classList.remove(
        "loading"
      );

      button.classList.add(
        "disabled"
      );

      button.textContent =
        "🔒 此日期無法訂房";


      alert(
        "這段住宿期間已有滿房日期，請重新選擇。"
      );

      return;

    }


    const nights =
      calculateNights(
        checkin,
        checkout
      );


    let childrenText =
      "🧒 小孩：0位";


    if(children > 0){

      childrenText =
        "🧒 小孩：" +
        children +
        "位";


      if(
        ages.length > 0
      ){

        childrenText +=
          "（" +
          ages.join("、") +
          "歲）";

      }

    }


    const message =

`🏡 香草貝兒訂房詢問
📅 入住：${formatDate(checkin)}
📅 退房：${formatDate(checkout)}
🌙 住宿：${nights}晚
👨 大人：${adults}位
${childrenText}
🐶 毛孩：${pets}隻

想詢問以上日期是否可以訂房，謝謝！`;


    const encodedLineID =
      encodeURIComponent(
        LINE_ID
      );


    const encodedMessage =
      encodeURIComponent(
        message
      );


    const lineURL =
      "https://line.me/R/oaMessage/" +
      encodedLineID +
      "/?" +
      encodedMessage;


    window.location.href =
      lineURL;

  }


  catch(error){

    console.error(
      error
    );


    button.disabled =
      false;

    button.classList.remove(
      "loading"
    );

    updateLineButtonState();


    alert(
      "目前無法確認房況，請稍後再試。"
    );

  }

}

/* ==================================================
   預設日期
================================================== */

function setDefaultDates(){

  const now =
    new Date();


  const today =
    now.getFullYear() +
    "-" +
    pad(
      now.getMonth() + 1
    ) +
    "-" +
    pad(
      now.getDate()
    );


  document.getElementById(
    "checkin"
  ).value =
    today;


  const tomorrow =
    new Date(now);


  tomorrow.setDate(
    tomorrow.getDate() + 1
  );


  const tomorrowString =
    tomorrow.getFullYear() +
    "-" +
    pad(
      tomorrow.getMonth() + 1
    ) +
    "-" +
    pad(
      tomorrow.getDate()
    );


  document.getElementById(
    "checkout"
  ).value =
    tomorrowString;

}
